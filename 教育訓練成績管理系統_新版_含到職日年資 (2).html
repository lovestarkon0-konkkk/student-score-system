<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>教育訓練成績管理系統</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    :root{
      --sage:#7A8F84; --deep:#445A50; --dark:#32453D; --cream:#F7F4EE;
      --gold:#C2A56B; --gold-soft:#EEE5D2; --white:#FFFFFF;
      --ink:#2F3834; --muted:#6E7772; --line:#D9DED9;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;background:var(--cream);color:var(--ink)}
    header{background:linear-gradient(135deg,var(--dark),var(--sage));color:#fff;padding:30px 20px;border-bottom:4px solid var(--gold)}
    .wrap{max-width:1220px;margin:auto}
    header h1{margin:0;font-size:30px;letter-spacing:1px}
    header p{margin:8px 0 0;opacity:.9}
    main{max-width:1220px;margin:24px auto;padding:0 16px 48px}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
    .stat,.card{background:var(--white);border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 20px rgba(68,90,80,.07)}
    .stat{padding:18px 20px;border-top:4px solid var(--gold)}
    .stat span{font-size:13px;color:var(--muted)}
    .stat b{display:block;font-size:28px;margin-top:7px;color:var(--deep)}
    .card{padding:22px;margin-bottom:18px}
    .card h2{font-size:19px;margin:0 0 16px;color:var(--dark)}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
    .span2{grid-column:span 2}
    label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:700}
    input,select,textarea{width:100%;padding:11px 12px;border:1px solid #CDD4CF;border-radius:11px;background:#fff;font-size:14px;color:var(--ink)}
    textarea{resize:vertical;min-height:76px}
    .actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
    button,.file-label{border:0;border-radius:11px;padding:10px 14px;cursor:pointer;font-size:14px;font-weight:700}
    .primary{background:var(--deep);color:#fff}.secondary{background:#E7ECE8;color:var(--dark)}
    .gold{background:var(--gold-soft);color:#6D582F}.danger{background:#F4E6E5;color:#8E5754}
    .file-label{display:inline-block}.file-label input{display:none}
    .filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin-bottom:14px}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
    table{width:100%;border-collapse:collapse;min-width:1250px;background:#fff}
    th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;white-space:nowrap}
    th{background:#F1F4F1;color:#53635C}
    .pill{display:inline-block;padding:5px 9px;border-radius:999px;font-weight:700;font-size:12px}
    .pass{background:#E4EEE7;color:#496A55}.fail{background:#F4E3E2;color:#8F5552}.wait{background:#F3EAD8;color:#896B36}
    .mini{padding:6px 9px;font-size:12px}
    .unit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
    .unit-box{background:#F6F7F4;border:1px solid var(--line);border-radius:12px;padding:13px}
    .unit-box b{display:block;color:var(--deep);font-size:16px;margin-bottom:4px}
    .empty{text-align:center;color:#89918D;padding:28px}
    footer{text-align:center;color:var(--muted);font-size:12px;padding:10px 15px 26px}
    @media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}}
    @media(max-width:560px){.stats,.grid,.filters{grid-template-columns:1fr}.span2{grid-column:span 1}header h1{font-size:24px}}
  </style>
</head>
<body>
<header><div class="wrap"><h1>教育訓練成績管理系統</h1><p>學員驗收、認證、回訓與課程結果管理</p></div></header>
<main>
  <section class="stats">
    <div class="stat"><span>總紀錄數</span><b id="totalCount">0</b></div>
    <div class="stat"><span>合格人數</span><b id="passCount">0</b></div>
    <div class="stat"><span>待補考</span><b id="waitCount">0</b></div>
    <div class="stat"><span>合格率</span><b id="passRate">0%</b></div>
  </section>

  <section class="card">
    <h2 id="formTitle">新增學員紀錄</h2>
    <div class="grid">
      <div><label>學員姓名 *</label><input id="name"></div>
      <div><label>院所 *</label><input id="unit" list="unitList"><datalist id="unitList"></datalist></div>
      <div><label>職稱</label><input id="title"></div>
      <div><label>員工編號</label><input id="employeeId"></div>
      <div><label>到職日</label><input id="hireDate" type="date" onchange="updateTenurePreview()"></div>
      <div><label>目前年資</label><input id="tenurePreview" placeholder="選擇到職日後自動計算" readonly></div>
      <div class="span2"><label>課程類型 *</label><select id="courseType">
        <option value="">請選擇</option><option>新人驗收</option><option>第八週驗收</option><option>MGA認證</option><option>小老師課程</option><option>回訓</option><option>主跟課程</option><option>其他</option>
      </select></div>
      <div><label>考試日期 *</label><input id="examDate" type="date"></div>
      <div><label>結果 *</label><select id="result"><option value="">請選擇</option><option>合格</option><option>未合格</option><option>待補考</option></select></div>
      <div><label>考官</label><input id="examiner"></div>
      <div class="span2"><label>備註</label><textarea id="note"></textarea></div>
    </div>
    <div class="actions"><button class="primary" onclick="saveRecord()">儲存紀錄</button><button class="secondary" onclick="resetForm()">清除表單</button></div>
  </section>

  <section class="card">
    <h2>搜尋與篩選</h2>
    <div class="filters">
      <input id="search" placeholder="搜尋姓名、員編、考官、備註…" oninput="renderAll()">
      <select id="filterUnit" onchange="renderAll()"><option value="">全部院所</option></select>
      <select id="filterCourse" onchange="renderAll()"><option value="">全部課程</option></select>
      <select id="filterResult" onchange="renderAll()"><option value="">全部結果</option><option>合格</option><option>未合格</option><option>待補考</option></select>
    </div>
    <div class="actions" style="margin-top:0">
      <button class="gold" onclick="exportExcel()">一鍵匯出 Excel</button>
      <button class="secondary" onclick="exportBackup()">備份資料 JSON</button>
      <label class="file-label secondary">還原備份<input type="file" accept=".json" onchange="importBackup(event)"></label>
    </div>
  </section>

  <section class="card"><h2>各院所統計</h2><div id="unitStats" class="unit-grid"></div></section>

  <section class="card">
    <h2>學員紀錄</h2>
    <div class="table-wrap"><table><thead><tr>
      <th>學員姓名</th><th>院所</th><th>職稱</th><th>員工編號</th><th>到職日</th><th>目前年資</th><th>課程類型</th><th>考試日期</th><th>結果</th><th>考官</th><th>備註</th><th>操作</th>
    </tr></thead><tbody id="tbody"></tbody></table></div>
  </section>
</main>
<footer>資料目前儲存在此瀏覽器。若未來需要多人共用與跨電腦同步，可再升級雲端資料庫。</footer>

<script>
const STORAGE_KEY='trainingRecords_v2'; let records=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'); let editingId=null;
const $=id=>document.getElementById(id);
function persist(){localStorage.setItem(STORAGE_KEY,JSON.stringify(records))}
function calcTenure(hireDate){
  if(!hireDate) return '';
  const start=new Date(hireDate+'T00:00:00');
  const now=new Date();
  if(Number.isNaN(start.getTime())||start>now) return '';
  let years=now.getFullYear()-start.getFullYear();
  let months=now.getMonth()-start.getMonth();
  let days=now.getDate()-start.getDate();
  if(days<0){months--;const prev=new Date(now.getFullYear(),now.getMonth(),0);days+=prev.getDate();}
  if(months<0){years--;months+=12;}
  if(years>0 && months>0) return `${years}年${months}個月`;
  if(years>0) return `${years}年`;
  if(months>0) return `${months}個月`;
  return `${days}天`;
}
function updateTenurePreview(){$('tenurePreview').value=calcTenure($('hireDate').value)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function unique(k){return [...new Set(records.map(r=>r[k]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hant'))}
function saveRecord(){
  const name=$('name').value.trim(),unit=$('unit').value.trim(),courseType=$('courseType').value,examDate=$('examDate').value,result=$('result').value;
  if(!name||!unit||!courseType||!examDate||!result){alert('請完成必填欄位');return}
  const rec={id:editingId||Date.now(),name,unit,title:$('title').value.trim(),employeeId:$('employeeId').value.trim(),hireDate:$('hireDate').value,courseType,examDate,result,examiner:$('examiner').value.trim(),note:$('note').value.trim()};
  records=editingId?records.map(r=>r.id===editingId?rec:r):[rec,...records];persist();resetForm();refreshFilters();renderAll()
}
function resetForm(){['name','unit','title','employeeId','hireDate','courseType','examDate','result','examiner','note'].forEach(id=>$(id).value='');editingId=null;$('tenurePreview').value='';$('formTitle').textContent='新增學員紀錄'}
function editRecord(id){const r=records.find(x=>x.id===id);if(!r)return;editingId=id;$('formTitle').textContent='修改學員紀錄';['name','unit','title','employeeId','hireDate','courseType','examDate','result','examiner','note'].forEach(k=>$(k).value=r[k]??'');updateTenurePreview();window.scrollTo({top:220,behavior:'smooth'})}
function deleteRecord(id){if(confirm('確定刪除這筆紀錄嗎？')){records=records.filter(r=>r.id!==id);persist();refreshFilters();renderAll()}}
function getFiltered(){const q=$('search').value.toLowerCase().trim(),u=$('filterUnit').value,c=$('filterCourse').value,rs=$('filterResult').value;return records.filter(r=>{const t=[r.name,r.unit,r.title,r.employeeId,r.hireDate,calcTenure(r.hireDate),r.courseType,r.examiner,r.note].join(' ').toLowerCase();return(!q||t.includes(q))&&(!u||r.unit===u)&&(!c||r.courseType===c)&&(!rs||r.result===rs)})}
function refreshFilters(){const u=$('filterUnit').value,c=$('filterCourse').value;$('filterUnit').innerHTML='<option value="">全部院所</option>'+unique('unit').map(v=>`<option>${esc(v)}</option>`).join('');$('filterCourse').innerHTML='<option value="">全部課程</option>'+unique('courseType').map(v=>`<option>${esc(v)}</option>`).join('');$('unitList').innerHTML=unique('unit').map(v=>`<option value="${esc(v)}"></option>`).join('');if([...$('filterUnit').options].some(o=>o.value===u))$('filterUnit').value=u;if([...$('filterCourse').options].some(o=>o.value===c))$('filterCourse').value=c}
function cls(r){return r==='合格'?'pass':r==='未合格'?'fail':'wait'}
function renderAll(){const filtered=getFiltered();$('tbody').innerHTML=filtered.length?filtered.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.unit)}</td><td>${esc(r.title)}</td><td>${esc(r.employeeId)}</td><td>${esc(r.courseType)}</td><td>${esc(r.examDate)}</td><td><span class="pill ${cls(r.result)}">${esc(r.result)}</span></td><td>${esc(r.examiner)}</td><td>${esc(r.note)}</td><td><button class="mini secondary" onclick="editRecord(${r.id})">修改</button> <button class="mini danger" onclick="deleteRecord(${r.id})">刪除</button></td></tr>`).join(''):'<tr><td colspan="12" class="empty">目前沒有符合條件的紀錄</td></tr>';
$('totalCount').textContent=records.length;const pass=records.filter(r=>r.result==='合格').length,wait=records.filter(r=>r.result==='待補考').length;$('passCount').textContent=pass;$('waitCount').textContent=wait;$('passRate').textContent=records.length?Math.round(pass/records.length*100)+'%':'0%';
const g={};records.forEach(r=>{if(!r.unit)return;g[r.unit]??={t:0,p:0,f:0,w:0};g[r.unit].t++;if(r.result==='合格')g[r.unit].p++;else if(r.result==='未合格')g[r.unit].f++;else g[r.unit].w++});$('unitStats').innerHTML=Object.keys(g).length?Object.entries(g).map(([u,s])=>`<div class="unit-box"><b>${esc(u)}</b><div>總紀錄：${s.t}</div><div>合格：${s.p}｜未合格：${s.f}｜待補考：${s.w}</div><div>合格率：${Math.round(s.p/s.t*100)}%</div></div>`).join(''):'<div class="empty">尚無院所資料</div>'}
function exportExcel(){const data=getFiltered();if(!data.length){alert('目前沒有可匯出的資料');return}const rows=data.map((r,i)=>({'序號':i+1,'學員姓名':r.name,'院所':r.unit,'職稱':r.title,'員工編號':r.employeeId,'到職日':r.hireDate||'','目前年資':calcTenure(r.hireDate),'課程類型':r.courseType,'考試日期':r.examDate,'結果':r.result,'考官':r.examiner,'備註':r.note}));const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'學員紀錄');XLSX.writeFile(wb,'教育訓練學員紀錄.xlsx')}
function exportBackup(){const blob=new Blob([JSON.stringify(records,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='教育訓練資料備份.json';a.click();URL.revokeObjectURL(a.href)}
function importBackup(e){const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=x=>{try{const d=JSON.parse(x.target.result);if(!Array.isArray(d))throw new Error();records=d;persist();refreshFilters();renderAll();alert('還原完成')}catch{alert('備份檔格式不正確')}};reader.readAsText(f)}
refreshFilters();renderAll();updateTenurePreview();
</script>
</body>
</html>
